name: samsaku-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: samsaku
      POSTGRES_DB: samsaku
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    volumes:
      - ledger:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samsaku -d samsaku"]
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      SAMSAKU_ENV: production
      DATABASE_URL: postgresql+psycopg://samsaku:${LOCAL_DB_PASSWORD}@db:5432/samsaku
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /v1
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SAMSAKU_DOMAIN: ${SAMSAKU_DOMAIN:-:80}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  ledger:
  caddy_data:
  caddy_config:
